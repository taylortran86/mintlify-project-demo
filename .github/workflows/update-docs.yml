name: Update Docs

on:
  push:
    branches:
      - main

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          PROJECT_ID: ${{ secrets.MINTLIFY_PROJECT_ID }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const projectId = process.env.PROJECT_ID;
            const apiKey = process.env.MINTLIFY_API_KEY;

            if (!projectId || !apiKey) {
            core.setFailed('Missing MINTLIFY_PROJECT_ID or MINTLIFY_API_KEY secrets');
            return;
            }

            const url = `https://api.mintlify.com/v1/agent/${projectId}/job`;
            const payload = {
            branch: `mintlify/docs-update-${Date.now()}`,
            messages: [
                {
                role: 'system',
                content: 'You are an action runner that updates documentation based on code changes. You should never ask questions. If you are not able to access the repository, report the error and exit.'
                },
                {
                role: 'user',
                content: `Update the documentation for our recent pushes to main:\n\nRepository: ${owner}/${repo}`
                }
            ]
            };

            try {
                const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
                });

                if (!response.ok) {
                throw new Error(`API request failed with status ${response.status}: ${await response.text()}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';
                for (const line of lines) {
                    if (line.trim()) {
                    console.log(line);
                    }
                }
                }
                if (buffer.trim()) {
                console.log(buffer);
                }

                core.notice(`Documentation update job triggered for ${owner}/${repo}`);
            } catch (error) {
                core.setFailed(`Failed to create documentation update job: ${error.message}`);
            }

  sync-openapi-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate OpenAPI spec
        working-directory: source
        run: |
          # Install dependencies
          pip install -r requirements.txt

          # Generate the OpenAPI spec from the running FastAPI app
          python -c "
          import json
          from backend.main import public_app

          spec = public_app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(spec, f, indent=2)
          "

      - name: Checkout target docs repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DOCS_REPO }}
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs

      - name: Copy OpenAPI spec to docs repo
        run: |
          cp source/openapi.json docs/openapi.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          path: docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          commit-message: "Update OpenAPI spec from ${{ github.repository }}@${{ github.sha }}"
          branch: sync-openapi-spec-${{ github.run_number }}
          title: "Update OpenAPI Specification"
          body: |
            ## OpenAPI Spec Update

            This PR updates the OpenAPI specification from the source repository.

            **Source Repository**: ${{ github.repository }}
            **Source Commit**: ${{ github.sha }}
            **Triggered by**: ${{ github.actor }}
            **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Changes
            - Updated `openapi.json` with the latest API specification
            - This includes any new endpoints, request/response schemas, and documentation updates