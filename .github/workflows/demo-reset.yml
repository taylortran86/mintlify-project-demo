name: Daily Demo Reset & Merge
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  demo-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
      
      - name: Fetch latest
        run: git fetch origin
      
      - name: Reset main to DEMO_BASELINE (UNMERGE PRs)
        run: |
          git checkout main
          git reset --hard DEMO_BASELINE
          git push --force origin main
      
      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
      
      - name: Re-merge PR 1
        run: |
          gh pr merge 1--merge --admin --repo ${{ github.repository }}
      
      - name: Re-merge PR 2
        run: |
          gh pr merge 2 --merge --admin --repo ${{ github.repository }}