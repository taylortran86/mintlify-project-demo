name: Daily Demo PRs

on:
  schedule:
    # 6AM PST = 14:00 UTC
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-demo-prs:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure Git
      - name: Configure Git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

      # Reset main to DEMO_BASELINE (unmerge previous PRs)
      - name: Reset main to DEMO_BASELINE
        run: |
          git fetch --all
          git checkout main
          git reset --hard DEMO_BASELINE
          git push --force origin main

      # Authenticate GitHub CLI
      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      # Create and merge PR1: task-statistics
      - name: Create and merge PR1 (task-statistics)
        run: |
          # Create PR1
          gh pr create --base main --head feature/task-statistics \
            --title "Daily Demo PR: task-statistics" \
            --body "Automatically generated PR for daily demo - adds task statistics feature" \
            --repo ${{ github.repository }}

          # Find and merge PR1
          PR1=$(gh pr list --state open --head feature/task-statistics --json number -q '.[0].number')
          echo "Merging PR #$PR1"
          gh pr merge $PR1 --merge --admin

      # Sync repository after first merge
      - name: Sync after first merge
        run: |
          git fetch --all
          git checkout main
          git pull origin main

      # Create and merge PR2: navigation-refactor
      - name: Create and merge PR2 (navigation-refactor)
        run: |
          # Create PR2
          gh pr create --base main --head feature/navigation-refactor \
            --title "Daily Demo PR: navigation-refactor" \
            --body "Automatically generated PR for daily demo - reorders page sections" \
            --repo ${{ github.repository }}

          # Find and merge PR2
          PR2=$(gh pr list --state open --head feature/navigation-refactor --json number -q '.[0].number')
          echo "Merging PR #$PR2"
          gh pr merge $PR2 --merge --admin
